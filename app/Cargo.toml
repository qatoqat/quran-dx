[package]
name = "quran-app"
description = "Quran.com reader ported to Dioxus (web + desktop)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dioxus.workspace = true
quran-api.workspace = true
serde.workspace = true
serde_json.workspace = true

# Browser (wasm) only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
gloo-timers = { version = "0.4", features = ["futures"] }

# Native (desktop) only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7"
tokio = { version = "1", features = ["time"] }

# `dx serve --platform web|desktop` picks the matching feature by itself.
# The window's own GTK handle, to give it the desktop's native frame (see main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
dioxus-ssr = "0.7.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
