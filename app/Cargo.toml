[package]
name = "quran-app"
description = "Quran.com reader ported to Dioxus (web + desktop)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dioxus.workspace = true
quran-api.workspace = true
serde.workspace = true
serde_json.workspace = true

# web-only
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage", "Document", "Element", "HtmlElement"] }
gloo-timers = { version = "0.4", optional = true, features = ["futures"] }

# desktop-only
dirs = { version = "7", optional = true }
tokio = { version = "1", optional = true, features = ["time"] }
# Desktop: download QCF font bytes natively (webview cross-origin font loads may be blocked).
reqwest = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys", "dep:gloo-timers"]
desktop = ["dioxus/desktop", "dep:dirs", "dep:tokio", "native-fonts"]
# Native (non-wasm) font download; enabled by `desktop`. Separate so it can be
# type-checked without the desktop (GTK) stack.
native-fonts = ["dep:reqwest"]

[dev-dependencies]
dioxus-ssr = "0.7.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
