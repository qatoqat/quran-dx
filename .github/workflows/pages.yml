name: Deploy to GitHub Pages

# A push to main (or a manual run) tests the workspace, builds the web app and
# publishes it. The site lives under /<repository name>/, so the build gets that
# as its base path; 404.html is a copy of the page, which makes reloads and
# shared links to any view (/2, /juz/30#78:1, ...) open the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Libraries for the desktop feature (the tests build it)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev
      - run: cargo test --workspace
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm dioxus-cli@0.7.10
      - name: Build the web app
        working-directory: app
        run: dx bundle --platform web --release --base-path "${{ github.event.repository.name }}"
      - name: Serve the app for every path
        run: cp target/dx/quran-app/release/web/public/index.html target/dx/quran-app/release/web/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/quran-app/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
