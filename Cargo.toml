[workspace]
resolver = "3"
members = ["crates/quran-api", "app"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
dioxus = { version = "0.7.10", features = ["router"] }
quran-api = { path = "crates/quran-api" }

# Dev web builds (`dx serve --platform web`) are unoptimised wasm by default,
# which is several times larger and much more memory-hungry in the browser.
# `wasm-dev` is the profile dx uses for web dev builds; light optimisation keeps
# rebuilds fast while cutting size/memory a lot.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# Release (`dx serve --release`, `dx bundle --release`): small and fast.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
